# Render Blueprint: keelchat's API with the console on one web service in your Render account. Deploy: https://render.com/deploy?repo=<your fork's URL>; docs/REFERENCE.md#deploy-from-github
# Render asks for ANTHROPIC_API_KEY once. KEELCHAT_API_KEY is generated: copy it from the service's Environment page to
# sign in to the console. Another provider: in Environment, set KEELCHAT_LLM=litellm, KEELCHAT_MODEL_GENERATE,
# KEELCHAT_MODEL_CLASSIFY and its key (e.g. OPENROUTER_API_KEY), as in .env.example.
# State is in memory unless you add DATABASE_URL (and REDIS_URL): saved bots go on restart without them.
services:
  - type: web
    name: keelchat
    runtime: docker
    plan: free # sleeps when idle; a paid plan keeps it awake
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # off, as Render advises for Deploy buttons: a push here must not redeploy everyone's copy. To redeploy your fork
    # when its CI passes, set Auto-Deploy to "After CI checks pass" in the service's Settings.
    autoDeployTrigger: "off" # quoted: bare off is YAML false
    envVars:
      - key: PORT # the port the image listens on
        value: "8080"
      - key: KEELCHAT_API_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
