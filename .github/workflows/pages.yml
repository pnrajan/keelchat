# The landing page (site/) on GitHub Pages, with the screenshots from docs/assets.
# Needs Settings → Pages → Source: GitHub Actions (Pages on a private repo needs a paid plan).
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, docs/assets/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: cp -r docs/assets site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
