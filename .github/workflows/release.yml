name: Release
# Publishes to PyPI when a GitHub release is published, with PyPI Trusted Publishing: no token is stored anywhere.
# PyPI trusts this repository, this file and the `pypi` environment (pypi.org → keelchat → Settings → Publishing).
# To release: bump `version` in pyproject.toml and the CHANGELOG, merge, then publish a release tagged v<version>.
on:
  release: {types: [published]}

permissions: {contents: read}

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: {name: pypi, url: "https://pypi.org/project/keelchat/"}
    permissions: {id-token: write}  # the short-lived identity PyPI checks
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: the tag matches the version
        env: {TAG: "${{ github.event.release.tag_name }}"}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match version $version in pyproject.toml"; exit 1; }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
