<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<script id="config" type="application/json">__CONFIG__</script>
<style>
/* One chat page for the widget (inside an iframe on a customer's site) and the installable app (full screen).
   Monochrome, system fonts only: nothing loads from a third party. */
:root {
  --bg: #ffffff; --surface: #f4f5f5; --line: #e4e6e6; --ink: #0b0c0c; --muted: #5d6464; --user: #0b0c0c; --user-ink: #ffffff; --err: #b42318;
  color-scheme: light; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0a0b0b; --surface: #141616; --line: #222525; --ink: #eceeee; --muted: #9aa0a0; --user: #eceeee; --user-ink: #0a0b0b; --err: #ff7b6e; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
.app { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .status { font-size: 12px; color: var(--muted); }
#close { border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; padding: 4px 6px; cursor: pointer; border-radius: 6px; }
#close:hover { color: var(--ink); background: var(--surface); }
main { flex: 1; overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 84%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; }
.msg.agent { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.note { align-self: center; background: transparent; color: var(--muted); font-size: 13px; text-align: center; }
.msg.error { color: var(--err); }
.typing { align-self: flex-start; display: inline-flex; gap: 4px; padding: 13px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; border-bottom-left-radius: 4px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite ease-in-out; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }
form { display: flex; gap: 8px; padding: 10px max(12px, env(safe-area-inset-right, 0px)) 12px max(12px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); }
#text { flex: 1; min-width: 0; font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 10px 14px; }
#send { font: inherit; font-weight: 600; border: 0; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 0 18px; cursor: pointer; }
#send:disabled { opacity: .4; cursor: default; }
#mic { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; width: 42px; flex: none; display: grid; place-items: center; cursor: pointer; }
#mic[aria-pressed="true"] { background: var(--ink); color: var(--bg); animation: rec 1.2s ease-in-out infinite; }
@keyframes rec { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { #mic[aria-pressed="true"] { animation: none; } }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }  /* rules like .gate below set display, which would beat the attribute */
.gate { display: flex; flex-direction: column; gap: 10px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); }
.gate p { margin: 0; }
.gate div { display: flex; gap: 8px; }
.gate input { flex: 1; min-width: 0; font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 10px 14px; letter-spacing: .2em; }
.gate button { font: inherit; font-weight: 600; border: 0; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 10px 18px; cursor: pointer; align-self: flex-start; }
.gate-msg { color: var(--muted); font-size: 13px; }
.foot { text-align: center; font-size: 11px; color: var(--muted); padding: 0 0 8px; }
</style>
</head>
<body>
<div class="app">
  <header><div class="mark" id="mark" aria-hidden="true">c</div><h1 id="title"></h1><span class="status" id="status"></span><button id="close" type="button" aria-label="Close chat" hidden>×</button></header>
  <main id="log" aria-live="polite"></main>
  <form id="gate" class="gate" hidden>
    <p id="gate-text">To keep your answers private, we'll send a code to the email or phone this link was sent to.</p>
    <button id="gate-send" type="button">Send me a code</button>
    <div id="gate-enter" hidden><input id="gate-code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="6-digit code" aria-label="Code"><button id="gate-ok" type="submit">Continue</button></div>
    <p id="gate-msg" class="gate-msg" role="status"></p>
  </form>
  <form id="form"><button id="mic" type="button" aria-label="Speak your answer" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><input id="text" autocomplete="off" maxlength="2000" placeholder="Type a message" aria-label="Message"><button id="send" type="submit">Send</button></form>
  <div class="foot">Messages may be stored to help with your request.</div>
</div>
<script>
(() => {
  const cfg = JSON.parse(document.getElementById("config").textContent);
  const $ = (id) => document.getElementById(id);
  const log = $("log"), form = $("form"), text = $("text"), send = $("send"), status = $("status");
  $("title").textContent = cfg.title; $("mark").textContent = (cfg.title || "c").slice(0, 1).toUpperCase();
  if (cfg.mode === "embed") { $("close").hidden = false; $("close").onclick = () => parent.postMessage({ keelchat: "close" }, "*"); }
  if (cfg.mode === "app") {
    const m = document.createElement("link"); m.rel = "manifest"; m.href = `/a/${cfg.id}/manifest.webmanifest`; document.head.appendChild(m);
    const t = document.createElement("meta"); t.name = "theme-color"; t.content = "#000000"; document.head.appendChild(t);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register(`/a/${cfg.id}/sw.js`, { scope: `/a/${cfg.id}` }).catch(() => {});
  }

  // per-browser visitor id and the open conversation (tab-scoped), when storage allows it
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };
  const vkey = `keelchat:visitor:${cfg.id}`, skey = `keelchat:session:${cfg.id}`;
  let session = null;
  try { session = JSON.parse(sessionStorage.getItem(skey) || "null"); } catch { session = null; }

  function add(cls, body) {
    const el = document.createElement("div"); el.className = "msg " + cls; el.textContent = body; log.appendChild(el);
    log.scrollTop = log.scrollHeight; return el;
  }
  async function api(path, body, token) {
    const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json", ...(token ? { authorization: `Bearer ${token}` } : {}) }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.detail || "Something went wrong. Please try again."); e.status = r.status; throw e; }
    return data;
  }
  async function ensure() {
    if (session) return session;
    const clickedScore = Number.isInteger(cfg.score) ? { score: cfg.score } : {};
    const s = await api(cfg.start, cfg.mode === "invite" ? clickedScore : { visitor_id: store(vkey) || undefined, ...clickedScore, labels: cfg.labels || {} });
    store(vkey, s.visitor_id);
    session = { id: s.session_id, token: s.token };
    try { sessionStorage.setItem(skey, JSON.stringify(session)); } catch { /* private mode */ }
    return session;
  }
  async function submit(value) {
    const msg = value.trim(); if (!msg) return;
    add("user", msg); text.value = ""; send.disabled = true; text.disabled = true;
    const typing = document.createElement("div"); typing.className = "typing"; typing.innerHTML = "<span></span><span></span><span></span>";
    log.appendChild(typing); log.scrollTop = log.scrollHeight;
    try {
      const s = await ensure();
      const r = await api(`/v1/public/sessions/${s.id}/turns`, { text: msg, message_id: crypto.randomUUID?.(), speak: voiceMode }, s.token);
      typing.remove(); add("agent", r.text); if (voiceMode) play(r);
      if (r.end_of_conversation) { add("note", "This conversation has ended. Send a message to start a new one."); session = null; try { sessionStorage.removeItem(skey); } catch {} }
    } catch (e) {
      typing.remove(); add("agent error", e.message);
      if (e.status === 401) { session = null; try { sessionStorage.removeItem(skey); } catch {} }
    } finally { send.disabled = false; text.disabled = false; text.focus(); }
  }
  form.addEventListener("submit", (e) => { e.preventDefault(); submit(text.value); });

  // voice: the server transcribes a WAV recording when it can; otherwise the browser's own speech recognition
  const mic = $("mic"), Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let voiceMode = false, recorder = null, chunks = [];
  const canRecord = cfg.server_stt && navigator.mediaDevices && window.MediaRecorder;
  if (canRecord || Rec) mic.hidden = false;
  function play(r) {
    if (r.audio) { new Audio(`data:${r.audio_type};base64,${r.audio}`).play().catch(() => {}); return; }
    if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(r.text); speechSynthesis.cancel(); speechSynthesis.speak(u); }
  }
  async function toWav(blob) {  // 16 kHz mono WAV: every speech-to-text model accepts it
    const ctx = new AudioContext(); const buf = await ctx.decodeAudioData(await blob.arrayBuffer()); ctx.close();
    const rate = 16000, len = Math.floor(buf.duration * rate), off = new OfflineAudioContext(1, len, rate);
    const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
    const pcm = (await off.startRendering()).getChannelData(0), out = new DataView(new ArrayBuffer(44 + pcm.length * 2));
    const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); out.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVEfmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true);
    out.setUint16(22, 1, true); out.setUint32(24, rate, true); out.setUint32(28, rate * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true);
    w(36, "data"); out.setUint32(40, pcm.length * 2, true);
    pcm.forEach((v, i) => out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 0x7fff, true));
    return new Blob([out], { type: "audio/wav" });
  }
  async function sendRecording(blob) {
    send.disabled = true; text.disabled = true;
    const typing = document.createElement("div"); typing.className = "typing"; typing.innerHTML = "<span></span><span></span><span></span>";
    log.appendChild(typing); log.scrollTop = log.scrollHeight;
    try {
      const s = await ensure(), wav = await toWav(blob);
      const r = await fetch(`/v1/public/sessions/${s.id}/voice`, { method: "POST", headers: { "content-type": "audio/wav", authorization: `Bearer ${s.token}` }, body: wav });
      const data = await r.json().catch(() => ({}));
      typing.remove();
      if (!r.ok) { add("agent error", data.detail || "I couldn't hear that. Please try again, or type."); return; }
      add("user", data.heard); add("agent", data.text); play(data);
      if (data.end_of_conversation) { add("note", "This conversation has ended."); session = null; }
    } catch (e) { typing.remove(); add("agent error", "I couldn't hear that. Please try again, or type."); }
    finally { send.disabled = false; text.disabled = false; }
  }
  mic.addEventListener("click", async () => {
    voiceMode = true;
    if (recorder && recorder.state === "recording") { recorder.stop(); return; }
    if (canRecord) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recorder = new MediaRecorder(stream); chunks = [];
        recorder.ondataavailable = (e) => chunks.push(e.data);
        recorder.onstop = () => { stream.getTracks().forEach((t) => t.stop()); mic.setAttribute("aria-pressed", "false"); sendRecording(new Blob(chunks, { type: recorder.mimeType })); };
        recorder.start(); mic.setAttribute("aria-pressed", "true");
        setTimeout(() => recorder && recorder.state === "recording" && recorder.stop(), 60000);
      } catch { add("note", "The microphone isn't available here. You can type instead."); }
      return;
    }
    const rec = new Rec(); rec.lang = navigator.language || "en-US"; rec.interimResults = false;
    rec.onstart = () => mic.setAttribute("aria-pressed", "true");
    rec.onend = () => mic.setAttribute("aria-pressed", "false");
    rec.onresult = (e) => submit(e.results[0][0].transcript);
    rec.onerror = () => add("note", "I couldn't hear that. You can type instead.");
    rec.start();
  });
  // identity code first, when the campaign asks for one
  if (cfg.verify) {
    const gate = $("gate"), msg = $("gate-msg");
    gate.hidden = false; form.hidden = true;
    const post = (path, body) => fetch(cfg.verify + path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) })
      .then(async (r) => ({ ok: r.ok, data: await r.json().catch(() => ({})) }));
    $("gate-send").onclick = async () => {
      msg.textContent = "Sending…";
      const r = await post("/code");
      if (!r.ok) { msg.textContent = r.data.detail || "We couldn't send a code. Try again in a minute."; return; }
      msg.textContent = r.data.to ? `We sent a code to ${r.data.to}.` : ""; $("gate-enter").hidden = false; $("gate-send").textContent = "Send a new code"; $("gate-code").focus();
      if (r.data.verified) { gate.hidden = true; form.hidden = false; }
    };
    gate.addEventListener("submit", async (e) => {
      e.preventDefault();
      const r = await post("/verify", { code: $("gate-code").value });
      if (!r.ok) { msg.textContent = r.data.detail || "That didn't work. Try again."; return; }
      gate.hidden = true; form.hidden = false; text.focus();
      if (cfg.greeting) add("agent", cfg.greeting);
      clicked();
    });
  }
  if (cfg.greeting && !cfg.verify) add("agent", cfg.greeting);
  // a person opened their invite (link scanners don't run scripts, so they never count)
  if (cfg.mode === "invite" && cfg.start) fetch(cfg.start.replace(/\/sessions$/, "/opened"), { method: "POST" }).catch(() => {});
  // a score clicked in the invite or order email: sent as their first answer, so the survey goes straight to the next question
  function clicked() { if (Number.isInteger(cfg.score) && !session) submit(String(cfg.score)); }
  if (!cfg.verify) clicked();
  status.textContent = navigator.onLine ? "" : "offline";
  addEventListener("online", () => status.textContent = ""); addEventListener("offline", () => status.textContent = "offline");
  text.focus();
})();
</script>
</body>
</html>
