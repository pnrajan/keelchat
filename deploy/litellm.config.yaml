# LiteLLM gateway config for `docker compose --profile gateway`. Aliases `small` and `large` are what the app uses
# (YACHAT_MODEL_CLASSIFY=small, YACHAT_MODEL_GENERATE=large); routing, fallbacks and cost live here.
model_list:
  - model_name: small
    litellm_params:
      model: openai/Qwen/Qwen3.5-35B-A3B
      api_base: os.environ/SILICONFLOW_BASE_URL
      api_key: os.environ/SILICONFLOW_API_KEY
      extra_body: {enable_thinking: false}
  - model_name: large
    litellm_params:
      model: openai/Qwen/Qwen3.5-35B-A3B
      api_base: os.environ/SILICONFLOW_BASE_URL
      api_key: os.environ/SILICONFLOW_API_KEY
      extra_body: {enable_thinking: false}
  - model_name: large
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  num_retries: 3
  request_timeout: 60
  fallbacks: [{large: [small]}]
  cache: true
  cache_params: {type: local}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
