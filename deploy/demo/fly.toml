# The public demo on Fly.io: the support assistant as a chat page, on the smallest machine, stopped when idle.
# Everything is in memory and set up again at each start (examples/demo/app.py). From the repo root:
#
#   fly apps create keelchat-demo         # once
#   scripts/demo.sh --secrets           # once, or when the model or key changes: copies them from .env
#   scripts/demo.sh                     # deploy the current checkout and check the live site
#
# KEELCHAT_API_KEY locks the console and API; visitors only reach the chat page, which limits conversations per
# network, per conversation and per day (KEELCHAT_DEMO_DAILY). Set a spending cap with your model provider too.

app = "keelchat-demo"
primary_region = "iad"
swap_size_mb = 512  # the app uses about 220 MB of the 256; swap absorbs bursts instead of a restart

[build]
  dockerfile = "../../Dockerfile"

[env]
  DATABASE_URL = ""
  REDIS_URL = ""
  KEELCHAT_TOOLS = "fake"
  KEELCHAT_CLIENT_IP_HEADER = "Fly-Client-IP"
  KEELCHAT_DEMO_DAILY = "300"
  # models, through OpenRouter (the key is a Fly secret: scripts/demo.sh --secrets). Chat on a small fast model; writing
  # bots on a strong reasoning model (it picks the clarifying questions and writes the YAML: the step that matters most),
  # at about ten cents a draft (KEELCHAT_DEMO_DRAFTS_DAILY caps the day)
  KEELCHAT_LLM = "litellm"
  KEELCHAT_MODEL_GENERATE = "openrouter/anthropic/claude-haiku-5.5"
  KEELCHAT_MODEL_CLASSIFY = "openrouter/anthropic/claude-haiku-5.5"
  KEELCHAT_DEMO_DRAFT_MODEL = "openrouter/anthropic/claude-opus-5.5"

[processes]
  app = "uvicorn examples.demo.app:create_app --factory --host 0.0.0.0 --port 8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
