# A conversational analyst over a structured dataset. Register the dataset first (see docs/WRITING_AN_AGENT.md):
#   PUT /v1/tenants/default/datasets/sales  with examples/data/orders.csv and examples/data/targets.parquet
agent: sales-analyst
charter: >-
  Answer questions about the online store's sales data. Every answer uses numbers from the data, states its assumptions
  and ends with practical recommendations. Out of scope: anything that is not about this sales data.
flow:
  - analytics:
      dataset: sales
limits: {digressions: 3, repairs: 2}
