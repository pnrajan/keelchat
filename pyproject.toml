[project]
name = "yachat"
version = "0.1.0"
description = "Open-source framework for chatbots written in YAML and extended in Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Pankaj Rajan", email = "pankaj@pankajrajan.com"}]
keywords = ["chatbot", "conversational-agent", "llm", "goal-oriented", "task-oriented-dialogue", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sentry-sdk[fastapi]>=2.20",
    "mcp>=1.0", # the API serves /mcp, so the server cannot start without it
    "pyjwt[crypto]>=2.8", # scoped API tokens (yachat/api/keys)
    "duckdb>=1.1", # the dashboards add up audit records in DuckDB (runtime/audit.py:audit_db)
]

[project.optional-dependencies]
#: what the API server process uses (sessions, Postgres, any litellm provider, S3 dataset sources, workspace metrics and
#: questions); the Docker image installs this by default (build arg EXTRAS)
api = [
    "redis>=5.0",
    "asyncpg>=0.29",
    "litellm>=1.50",
    "boto3>=1.34",
    "duckdb>=1.1",
    "pandas>=2.2",
    "vanna>=2.0.2,<3",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "cryptography>=43",
]
redis = ["redis>=5.0"]
postgres = ["asyncpg>=0.29"]
knowledge = [
    "boto3>=1.34",
    "lancedb>=0.15",
    "litellm>=1.50",
    "mcp>=1.0",
]
analytics = [
    "duckdb>=1.1",
    "vanna>=2.0.2,<3",
    "pandas>=2.2",
    "pyarrow>=17",
    "litellm>=1.50",
    "boto3>=1.34",
    "smolagents>=1.26,<2",
]
#: the local sandbox (bubblewrap runs the service's own interpreter; docker/podman run deploy/sandbox's image)
sandbox = [
    "llm-sandbox[docker]>=0.3.46",
    "numpy>=2",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
]
#: AWS Bedrock AgentCore Code Interpreter as the sandbox
agentcore = ["bedrock-agentcore>=1.25"]
audit = [
    "pyiceberg[pyarrow,pyiceberg-core,sql-postgres]>=0.9",
]
mem0 = [
    "mem0ai>=0.1.100",
]
#: `yachat evals run`: DeepEval and Ragas metrics scored by a judge model over litellm
evals = [
    "deepeval>=3.0",
    "langchain-community>=0.4,<0.4.2",  # ragas 0.4.3 imports chat_models.vertexai, removed in 0.4.2
    "litellm>=1.50",
    "ragas>=0.4,<0.5",  # tested range; lift with the langchain-community cap once ragas drops that import
]

[project.urls]
Homepage = "https://github.com/pnrajan/yachat"
Documentation = "https://github.com/pnrajan/yachat/tree/main/docs"
Issues = "https://github.com/pnrajan/yachat/issues"
Changelog = "https://github.com/pnrajan/yachat/blob/main/CHANGELOG.md"

[project.scripts]
yachat = "yachat.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "redis>=5.0",
    "asyncpg>=0.29",
    "fakeredis>=2.26",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "contrib-tool",
    "litellm>=1.50",
    "lancedb>=0.15",
    "boto3>=1.34",
    "deepeval>=3.0",
    "pytest-xdist>=3.5",
    "pytest-rerunfailures>=14",
    "pre-commit>=4",
    "mcp>=1.0",
    "duckdb>=1.1",
    "vanna>=2.0.2,<3",
    "pandas>=2.2",
    "pyarrow>=17",
    "pandas-stubs",
    "smolagents>=1.26,<2",
    "llm-sandbox[docker]>=0.3.46",
    "bedrock-agentcore>=1.25",
    "numpy>=2",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pyiceberg[pyarrow,pyiceberg-core,sql-postgres,sql-sqlite]>=0.9",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "cryptography>=43",
    "ragas>=0.4,<0.5",
    "langchain-community>=0.4,<0.4.2",
]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yachat"]

[tool.hatch.build.targets.sdist]
exclude = ["frontend/node_modules", "frontend/dist", "frontend/screens", "**/__pycache__", ".claude", ".serena", ".github", "docs/assets", "*.lancedb", ".lancedb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:deepeval -n 3 --reruns 1 --reruns-delay 3"   # real-model tests: 3 workers (rate limits), one retry for model variance

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["yachat"]
ignore_missing_imports = true

[tool.uv.workspace]
members = [
    "examples/contrib_tool",
]

[tool.uv.sources]
contrib-tool = { workspace = true }
