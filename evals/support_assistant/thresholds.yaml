policy: ../../examples/support_assistant.yaml
context_tools: [knowledge_search]            # the documents are the source; other tool output is not
minimums:
  role_adherence: 0.8
  rule_followed: 0.8                           # replies on turns where a rule matched do what it says
  ragas.Faithfulness: 0.8                      # answers from documents claim only what the passages say
  ragas.ContextPrecisionWithoutReference: 0.7  # the passages retrieved were the useful ones
calibration: {}
